# Para Dokploy: Traefik de Dokploy pone HTTPS y dominios.
# Sin "ports" publicos: los dominios se asignan en la UI de Dokploy
#   frontend -> puerto 80
#   backend  -> puerto 4000
# Las variables se definen en la pestana Environment de Dokploy.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-9drive}
      APP_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL, p. ej. https://9drive.tudominio.com}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Define TOKEN_ENCRYPTION_KEY}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Define GOOGLE_REDIRECT_URI, p. ej. https://api.9drive.tudominio.com/connected-accounts/google/callback}
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Define VITE_API_URL, p. ej. https://api.9drive.tudominio.com}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_ALLOW_REGISTRATION: ${VITE_ALLOW_REGISTRATION:-${ALLOW_REGISTRATION:-true}}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  mysql_data:
